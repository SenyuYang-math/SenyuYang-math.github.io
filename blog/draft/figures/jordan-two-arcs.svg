<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" role="img" aria-labelledby="title desc">
  <rect width="700" height="480" fill="#fff"/>
  <title id="title">正方形与 Jordan 曲线的两段弧</title>
  <desc id="desc">正方形 Γ 的底边与 Jordan 曲线 J 恰交于两点 a 与 b，这两点位于底边的内部. J 上连接 a 与 b 的两段弧记为 JR 与 JB，底边被它们分成若干交替的红、蓝区间.</desc>

  <!-- the two lobes of J dipping below the square: drawn first so the square sits on top -->
  <path d="M 150 352 C 150 452, 300 452, 300 352"
        fill="none" stroke="#c0392b" stroke-width="3"/>
  <path d="M 380 352 C 380 452, 530 452, 530 352"
        fill="none" stroke="#2b4fc0" stroke-width="3"/>

  <!-- the rest of J: a big oval above and around -->
  <path d="M 150 352 C 60 300, 60 150, 200 78 C 300 28, 500 28, 580 96 C 680 180, 620 320, 530 352"
        fill="none" stroke="#111" stroke-width="2.6"/>
  <!-- the stretch between the two crossings stays above the bottom edge -->
  <path d="M 300 352 C 320 330, 360 330, 380 352"
        fill="none" stroke="#111" stroke-width="2.6"/>

  <!-- square Gamma -->
  <rect x="150" y="120" width="380" height="232" fill="none" stroke="#111" stroke-width="2.6"/>
  <text x="330" y="150" font-size="19" fill="#111" font-style="italic" text-anchor="middle">Γ</text>

  <!-- bottom edge colouring: red, blue, red (each interval takes the colour of the arc that encloses it) -->
  <line x1="150" y1="352" x2="300" y2="352" stroke="#f6c9c9" stroke-width="9"/>
  <line x1="300" y1="352" x2="380" y2="352" stroke="#c9d8f6" stroke-width="9"/>
  <line x1="380" y1="352" x2="530" y2="352" stroke="#f6c9c9" stroke-width="9"/>

  <!-- crossing points a and b -->
  <g fill="#111">
    <circle cx="300" cy="352" r="5"/>
    <circle cx="380" cy="352" r="5"/>
  </g>
  <text x="300" y="382" font-size="19" fill="#111" font-style="italic" text-anchor="middle">a</text>
  <text x="380" y="382" font-size="19" fill="#111" font-style="italic" text-anchor="middle">b</text>

  <!-- arc labels -->
  <text x="120" y="300" font-size="18" fill="#c0392b" font-style="italic" text-anchor="middle">JR</text>
  <text x="580" y="300" font-size="18" fill="#2b4fc0" font-style="italic" text-anchor="middle">JB</text>

  <!-- notes -->
  <line x1="330" y1="356" x2="330" y2="424" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="336" y="440" font-size="15" fill="#111">底边被交替染成红、蓝区间</text>
  <text x="30" y="472" font-size="15" fill="#111">a 与 b 位于 Γ 底边的内部，二者在 Γ 的两侧</text>
</svg>
