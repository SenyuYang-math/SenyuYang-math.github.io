<text x="344.0" y="105.6" font-size="19" fill="#111" text-anchor="middle" font-style="italic">C</text>
<text x="172.4" y="158.4" font-size="18" fill="#111" text-anchor="middle">U</text>
<text x="370.0" y="286.0" font-size="17" fill="#2b4fc0" text-anchor="middle" font-style="italic">T</text>
<text x="536.4" y="248.6" font-size="16" fill="#c0392b" text-anchor="middle" font-style="italic">S</text>
<text x="91.4" y="242.0" font-size="19" fill="#111" text-anchor="middle" font-style="italic">C</text>
<text x="599.2" y="158.4" font-size="19" fill="#111" text-anchor="middle" font-style="italic">C</text>
<text x="448.0" y="290.4" font-size="18" fill="#111" text-anchor="middle">V</text>
<circle cx="448.0" cy="220.0" r="4.5" fill="#111"/>
<line x1="453.2" y1="215.6" x2="531.2" y2="162.8" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>
<text x="536.2" y="162.8" font-size="15" fill="#111" text-anchor="start">S ∩ T</text>
<line x1="583.2" y1="193.6" x2="650.8" y2="211.2" stroke="#555" stroke-width="1" stroke-dasharray="3,3"/>
<text x="655.8" y="211.2" font-size="18" fill="#1f7a3d" text-anchor="start" font-style="italic">C*</text>
<text x="370.0" y="352.0" font-size="15" fill="#c0392b" text-anchor="middle">被替换的边</text>
<text x="36" y="541" font-size="15" fill="#111">绿色 C*：把 C 中位于 T 内部的边换成 T 的其余三边</text>
<text x="36" y="563" font-size="15" fill="#111">S 与 T 只相交于一点，U 是 C 的、不含该点的那一侧</text>
</svg>
