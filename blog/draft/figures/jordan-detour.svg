<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 585" role="img" aria-labelledby="title desc">
  <rect width="680" height="585" fill="#fff"/>
<title id="title">绕行引理的构造</title>
<desc id="desc">圈 C 是 L 形区域的边界，它有界的一侧 U 填成浅红. 矩形 T 与 C 共享条形部分下边的一段. 把这段公共边换成 T 的其余三边，得到绿色的圈 C*. S 位于 C 的另一侧 V 中，它与 T 只相交于一点.</desc>
<rect x="84.0" y="88.0" width="520.0" height="132.0" fill="#f6c9c9"/>
