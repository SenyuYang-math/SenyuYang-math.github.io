<path d="M 84.0 352.0 L 136.0 352.0 L 188.0 352.0 L 240.0 352.0 L 240.0 308.0 L 240.0 264.0 L 240.0 220.0 L 292.0 220.0 L 292.0 264.0 L 292.0 308.0 L 292.0 352.0 L 344.0 352.0 L 396.0 352.0 L 448.0 352.0 L 448.0 308.0 L 448.0 264.0 L 448.0 220.0 L 500.0 220.0 L 552.0 220.0 L 604.0 220.0 L 604.0 176.0 L 604.0 132.0 L 604.0 88.0 L 552.0 88.0 L 500.0 88.0 L 448.0 88.0 L 396.0 88.0 L 344.0 88.0 L 292.0 88.0 L 240.0 88.0 L 188.0 88.0 L 136.0 88.0 L 84.0 88.0 L 84.0 132.0 L 84.0 176.0 L 84.0 220.0 L 84.0 264.0 L 84.0 308.0 L 84.0 352.0" fill="none" stroke="#1f7a3d" stroke-width="5"/>
