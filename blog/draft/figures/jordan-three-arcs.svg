<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" role="img" aria-labelledby="title desc">
  <rect width="760" height="570" fill="#fff"/>
  <title id="title">三段弧与三条圈路径</title>
  <desc id="desc">Jordan 曲线 J 被三个点 u₁, u₂, u₃ 分成三段弧 J₁, J₂, J₃. 三条轴对齐的圈路径 s₁, s₂, s₃ 分别连接外侧的点 a₁, a₂, a₃，每条 sᵢ 都避开它与端点相对的那段弧，三者合起来围成一个圈.</desc>

  <!-- Jordan curve J -->
  <path d="M 330 330
           C 200 330, 120 300, 110 225
           C 100 145, 215 72, 350 72
           C 490 72, 600 145, 590 225
           C 580 300, 470 330, 330 330 Z"
        fill="#fafafa" stroke="#111" stroke-width="2.8"/>

  <!-- junction points -->
  <g fill="#111">
    <circle cx="330" cy="330" r="5"/>
    <circle cx="110" cy="225" r="5"/>
    <circle cx="590" cy="225" r="5"/>
  </g>
  <text x="330" y="356" font-size="17" fill="#111" font-style="italic" text-anchor="middle">u₁</text>
  <text x="92" y="255" font-size="17" fill="#111" font-style="italic" text-anchor="end">u₃</text>
  <text x="608" y="255" font-size="17" fill="#111" font-style="italic" text-anchor="start">u₂</text>

  <!-- arc labels J1 (left), J2 (right), J3 (bottom) -->
  <text x="150" y="140" font-size="18" fill="#111" font-style="italic" text-anchor="middle">J₁</text>
  <text x="556" y="140" font-size="18" fill="#111" font-style="italic" text-anchor="middle">J₂</text>
  <text x="350" y="322" font-size="18" fill="#111" font-style="italic" text-anchor="middle">J₃</text>

  <!-- the three points -->
  <g fill="#c0392b">
    <circle cx="60" cy="300" r="5.5"/>
    <circle cx="710" cy="300" r="5.5"/>
    <circle cx="380" cy="510" r="5.5"/>
  </g>
  <text x="42" y="330" font-size="18" fill="#c0392b" font-style="italic" text-anchor="middle">a₁</text>
  <text x="728" y="330" font-size="18" fill="#c0392b" font-style="italic" text-anchor="middle">a₂</text>
  <text x="356" y="522" font-size="18" fill="#c0392b" font-style="italic" text-anchor="end">a₃</text>

  <!-- s1: connects a3 to a2 (avoids J1) -->
  <path d="M 380 510 L 380 450 L 710 450 L 710 300"
        fill="none" stroke="#1f7a3d" stroke-width="2.4"/>
  <text x="582" y="442" font-size="17" fill="#1f7a3d" font-style="italic" text-anchor="middle">s₁</text>

  <!-- s2: connects a1 to a3 (avoids J2) -->
  <path d="M 60 300 L 60 450 L 380 450 L 380 510"
        fill="none" stroke="#1f7a3d" stroke-width="2.4"/>
  <text x="176" y="442" font-size="17" fill="#1f7a3d" font-style="italic" text-anchor="middle">s₂</text>

  <!-- s3: connects a2 to a1 (avoids J3) -->
  <path d="M 710 300 L 710 170 L 60 170 L 60 300"
        fill="none" stroke="#1f7a3d" stroke-width="2.4"/>
  <text x="386" y="162" font-size="17" fill="#1f7a3d" font-style="italic" text-anchor="middle">s₃</text>

  <!-- where the green paths overlap, mark the shared stretch -->
  <line x1="380" y1="450" x2="380" y2="510" stroke="#1f7a3d" stroke-width="2.4"/>

  <text x="30" y="552" font-size="15" fill="#111">三条圈路径合起来是圈 C = s₁ ∪ s₂ ∪ s₃，避开 Jᵢ 的 sᵢ 与其余两条共用一段</text>
</svg>
